name: Verify chat example

on:
  push:
    branches: [preview, rc, main]
  pull_request:
    branches: [preview, rc, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    name: Example Verification / ${{ github.base_ref || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Check dependency channel
        id: channel
        env:
          TARGET_CHANNEL: ${{ github.base_ref || github.ref_name }}
        run: python3 scripts/release/example_channels.py --channel "$TARGET_CHANNEL" --github-output "$GITHUB_OUTPUT"
      - name: Install pinned Spine CLI
        env:
          CLI_VERSION: ${{ steps.channel.outputs.cli_version }}
        run: go install "github.com/NARUBROWN/spine-cli/cmd/spine@$CLI_VERSION"
      - run: go mod download
      - run: spine verify --warnings-as-errors --json
      - run: spine build
      - run: spine contract probe --json
      - run: go test -race -count=1 ./...
      - run: go test -race -count=1 -tags=e2e -v ./e2e
